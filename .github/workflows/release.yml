# Build jellydl for Linux (amd64, arm64, armv7) and macOS (Intel, Apple Silicon).
#
# - Push a tag like v0.2.0: tests run, binaries are built, and a GitHub release
#   is created with the archives and their SHA-256 sums. Each archive gets a
#   signed build provenance attestation (who built it, from which commit).
#   A Docker image (linux/amd64, linux/arm64, linux/arm/v7) is published to
#   ghcr.io/vsellier/jellydl, with its own attestation.
# - Run it by hand (Actions tab > Release > Run workflow): binaries are built and
#   kept as workflow artifacts, and the image is built. Nothing is published.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Clippy and the tests, from ci.yml.
  test:
    uses: ./.github/workflows/ci.yml

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup is already on the runner: no third-party action needed.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # No release with a dependency that has a known vulnerability.
      - run: cargo audit

  build:
    needs: [test, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl): they run on any distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-arm64
            cross: true
          # 32-bit ARM with hardware float: older Raspberry Pi, 32-bit systems, NAS.
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            name: linux-armv7
            cross: true
          # macos-latest is Apple Silicon. It also builds the Intel binary.
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # For the build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update -t ${{ matrix.target }}
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        id: package
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then version="dev-${GITHUB_SHA::7}"; fi
          dir="jellydl-$version-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/jellydl" README.md LICENSE config.example.toml "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          if command -v sha256sum >/dev/null; then
            sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          else
            shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
          fi
          echo "archive=$dir.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Check the binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/jellydl"
          file "$bin"
          # Run it only when it matches the CPU of the runner.
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl|aarch64-apple-darwin) "$bin" --version ;;
          esac

      # Signed statement: this archive was built from this commit by this workflow.
      # Check it with: gh attestation verify <archive> --repo vsellier/jellydl
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Docker image for linux/amd64, linux/arm64 and linux/arm/v7, from the Linux binaries above.
  # This job runs no project code: it only copies the binaries into the image.
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the image provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: archives
          merge-multiple: true

      # Only package archives that this workflow built and attested.
      - name: Check the archives
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in archives/*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done

      - name: Put the binaries in dist/<arch>/
        run: |
          # Archive name -> Docker TARGETARCH (linux/arm/v7 is "arm").
          for pair in amd64:amd64 arm64:arm64 armv7:arm; do
            name=${pair%%:*} arch=${pair##*:}
            mkdir -p "dist/$arch" "tmp/$arch"
            tar -xzf archives/jellydl-*-linux-$name.tar.gz -C "tmp/$arch"
            mv tmp/$arch/*/jellydl "dist/$arch/jellydl"
          done
          file dist/*/jellydl
          # Image names must be lowercase.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 gives the tags 1.2.3, 1.2 and latest. A manual run gives sha-<commit>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A manual run builds the image but does not publish it.
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest image provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
